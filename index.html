<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Web Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 10px; background-color: #f5f5f5; }
        .chat-box { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: white; border-radius: 8px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user { color: white; background-color: #007bff; margin-left: auto; text-align: right; }
        .bot { color: #333; background-color: #e2e2e2; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .key-area { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Чат с DeepSeek (Бесплатный хостинг)</h2>
    
    <div class="key-area">
        <input type="password" id="apiKey" placeholder="Вставьте ваш API-ключ DeepSeek и общайтесь" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg bot"><b>DeepSeek:</b> Привет! Вставьте ваш API-ключ выше, введите сообщение и я отвечу вам с учетом контекста беседы.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        // Здесь хранится контекст переписки
        let chatHistory = [
            { role: "system", content: "Ты — полезный ассистент." }
        ];

        async function sendMessage() {
            const inputDel = document.getElementById('userInput');
            const keyDel = document.getElementById('apiKey');
            const chatBox = document.getElementById('chatBox');
            
            const text = inputDel.value.trim();
            const apiKey = keyDel.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("Пожалуйста, введите ваш API-ключ DeepSeek!");
                return;
            }

            // 1. Отображаем сообщение пользователя и добавляем в историю (контекст)
            chatBox.innerHTML += `<div class="msg user"><b>Вы:</b> ${text}</div>`;
            chatHistory.push({ role: "user", content: text });
            inputDel.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Отправляем запрос в DeepSeek со ВСЕЙ историей
            try {
                const response = await fetch('https://deepseek.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-flash',
                        messages: chatHistory
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const botText = data.choices[0].message.content;
                    
                    // 3. Добавляем ответ бота в историю (контекст) и на экран
                    chatBox.innerHTML += `<div class="msg bot"><b>DeepSeek:</b> ${botText}</div>`;
                    chatHistory.push({ role: "assistant", content: botText });
                } else {
                    chatBox.innerHTML += `<div class="msg bot" style="color:red;"><b>Ошибка:</b> Не удалось получить ответ. Код: ${response.status}</div>`;
                }
            } catch (error) {
                chatBox.innerHTML += `<div class="msg bot" style="color:red;"><b>Ошибка сети:</b> ${error.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
